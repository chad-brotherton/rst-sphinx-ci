[[case]]
id = "usd-core-version"
tags = ["not-in-docs"]
question = "What's the minimum version of usd-core I need?"
reference = """
The docs don't give a version number. They say CI tests on Python 3.11 with the oldest
supported usd-core, but not which version that is.
"""

[[case]]
id = "fix-references"
tags = ["not-in-docs"]
question = "Can usd-inspect fix a broken reference for me, for example by pointing it at the right file?"
reference = """
The docs don't describe any way to fix references. They describe the tool as listing prims
and attributes and reporting references and payloads whose files are missing.
"""
