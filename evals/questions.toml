question = "How complex a scene can I analyze with this tool?"
reference = """
The docs don't say. They don't give any limit on scene size or complexity, or any performance
figures. (They do say that open_stage loads all payloads.)
"""

[[case]]
id = "license"
tags = ["not-in-docs"]
question = "What license is USD Scene Inspector released under?"
reference = "The docs don't say what license the tool uses."

[[case]]
id = "usdz"
tags = ["not-in-docs"]
question = "Can I inspect a .usdz file?"
reference = """
The docs don't say. They describe reading .usda and .usd files and don't mention .usdz.
