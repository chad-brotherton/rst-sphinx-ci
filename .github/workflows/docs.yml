name: Docs CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  schedule:
    # Weekly link check: Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  # Cancel superseded pull request runs, but never interrupt a run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests (Python ${{ matrix.python }}, ${{ matrix.deps }} deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Python with the oldest supported usd-core.
          - python: "3.11"
            deps: lowest
          - python: "3.14"
            deps: latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The docs extra is needed because tests/test_llms_txt.py builds the docs.
      - name: Install package, docs, and test dependencies
        run: pip install -e ".[docs,test]"

      - name: Pin lowest supported dependencies
        if: matrix.deps == 'lowest'
        run: pip install "usd-core==26.5"

      - name: Run pytest
        run: pytest

  docs:
    name: docs (HTML and doctest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and docs dependencies
        run: pip install -e ".[docs]"

      - name: Build HTML (warnings are errors)
        run: make -C docs html SPHINXOPTS="-W --keep-going"

      - name: Run doctests
        run: make -C docs doctest SPHINXOPTS="-W --keep-going"

      # Runs on every pull request, so a broken generator fails the build.
      - name: Generate llms.txt, llms-full.txt, and Markdown pages
        run: python scripts/build_llms_txt.py

      - name: Upload site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  vale:
    name: vale (style and spelling)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Vale parses reStructuredText with docutils' rst2html.
      - name: Install docutils
        run: pip install docutils

      - uses: errata-ai/vale-action@v3
        with:
          version: 3.25.1
          files: docs/source,README.md,src,scripts
          separator: ","
          # Check every line, not only lines this pull request changed.
          filter_mode: nofilter
          fail_on_error: true

  linkcheck:
    name: linkcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # External sites go down; don't block pull requests on them. The weekly run must pass.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and docs dependencies
        run: pip install -e ".[docs]"

      - name: Check links
        run: make -C docs linkcheck

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
