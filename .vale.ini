# Vale configuration. Run `vale sync` once to download the Google style into styles/.
StylesPath = styles
MinAlertLevel = warning
Packages = Google
Vocab = USD

[*.{rst,md,py}]
BasedOnStyles = Vale, Google

# Docstrings mention file names and packages such as ``.usd`` and ``usd-core``,
# which Vale.Terms would "correct" to USD. Spelling still applies.
[*.py]
Vale.Terms = NO
